name: Page, tools or docs
description: Something in the page, the verifier or the documentation is wrong or hard to use.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - the page (index.html, assets/)
        - the verifier (tools/verify)
        - the example data or its generator
        - schemas
        - documentation
        - CI
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Include the URL or command, the browser or Go version, and screenshots for the page.
    validations:
      required: true

  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility
      description: If this is an accessibility problem, which assistive technology, browser and operating system you use.
