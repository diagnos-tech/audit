name: Tools or docs
description: Something in the verifier, the schemas or the documentation is wrong or hard to use.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - the verifier (tools/verify)
        - the example data or its generator
        - schemas
        - documentation
        - CI
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Include the command and its output, and your Go version.
    validations:
      required: true
